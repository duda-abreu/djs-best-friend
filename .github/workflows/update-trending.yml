name: Atualiza em alta da semana

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests

      - run: python scripts/update_trending.py

      - name: Commita se mudou
        run: |
          if git diff --quiet docs/trending.json; then
            echo "sem mudancas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/trending.json
          git commit -m "atualiza em alta da semana"
          git push

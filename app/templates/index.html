<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>djs-best-friend</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>djs-best-friend</h1>
    <p class="subtitle">Busque uma musica e baixe o audio na melhor qualidade disponivel.</p>

    <form id="search-form">
      <input type="text" id="query" placeholder="Nome da musica ou artista" required />
      <select id="source">
        <option value="spotify">Spotify (metadados + mp3 320k)</option>
        <option value="youtube">YouTube (audio original, sem reencode)</option>
      </select>
      <button type="submit">Buscar</button>
    </form>

    <p class="hint">
      Dica: "YouTube (audio original)" preserva o bitrate real da fonte. "Spotify" reencoda
      para mp3 320kbps e embute capa/artista/album, mas nao aumenta a qualidade acima do
      stream original.
    </p>

    <ul id="results"></ul>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ's Best Friend</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css?v={{ cache_bust }}" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="titles">
        <h1 id="home-link" title="voltar pro início">DJ's Best Friend</h1>
        <p class="subtitle">music downloader</p>
      </div>
      <div class="topbar-right">
        <button type="button" id="spotify-auth-btn" class="glossy-btn small">conectar com Spotify</button>
        <svg class="note-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="16" cy="48" r="9" fill="currentColor" />
          <circle cx="40" cy="44" r="9" fill="currentColor" />
          <rect x="23" y="12" width="5" height="38" fill="currentColor" />
          <rect x="47" y="8" width="5" height="38" fill="currentColor" />
          <path d="M23 12 L52 8 L52 16 L23 20 Z" fill="currentColor" />
        </svg>
      </div>
    </header>

    <div class="stats-bar panel" id="stats-bar" title="clique pra ver o histórico">
      <div class="stat">
        <span class="stat-value" id="stat-count">0</span>
        <span class="stat-label">músicas baixadas</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-gb">0</span>
        <span class="stat-label">GB no total</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-week">0</span>
        <span class="stat-label">nos últimos 7 dias</span>
      </div>
    </div>

    <main class="deck">
      <section class="panel now-panel">
        <div class="art" id="now-art"></div>
        <div class="now-info">
          <div class="now-title" id="now-title">nenhum download ainda</div>
          <div class="now-artist" id="now-artist">busque uma música ao lado pra começar</div>
          <div class="now-source" id="now-source">&nbsp;</div>
          <div class="now-bpm" id="now-bpm">&nbsp;</div>

          <div class="now-progress">
            <div class="track"><div class="fill" id="now-fill"></div></div>
          </div>
          <div class="now-status" id="now-status">em espera</div>
        </div>
      </section>

      <section class="panel list-panel">
        <form id="search-form" class="search-row">
          <input type="text" id="query" placeholder="nome da música ou artista" required />
          <select id="source">
            <option value="spotify">Spotify (320k)</option>
            <option value="youtube">YouTube (original)</option>
          </select>
          <select id="result-limit" title="quantidade de resultados">
            <option value="10">10 resultados</option>
            <option value="20">20 resultados</option>
            <option value="50">50 resultados</option>
          </select>
          <button type="submit" class="glossy-btn round" title="buscar" aria-label="buscar">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          </button>
        </form>

        <h2 class="list-title" id="results-title">em alta essa semana</h2>
        <ul id="results" class="track-list">
          <li class="empty-hint">carregando sugestões...</li>
        </ul>
      </section>
    </main>

    <footer class="statusbar">
      <span id="clock">--:--</span>
      <span class="sep">|</span>
      <span id="footer-msg">pronto</span>
    </footer>
  </div>

  <script src="/static/app.js?v={{ cache_bust }}"></script>
</body>
</html>
